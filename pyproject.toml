[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioinformatics-tools"
version = "0.1.0"
description = "Simple bioinformatics utilities for DNA/RNA analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Your Name" }]
dependencies = ["matplotlib>=3.8.0", "streamlit>=1.36.0"]

[project.scripts]
bioinformatics-tools = "bioinformatics_tools.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
